<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" style="background:#fff; font-family:Georgia,serif;">

  <!-- Grid lines -->
  <line x1="30" y1="150" x2="270" y2="150" stroke="#ececec" stroke-width="1"/>
  <line x1="150" y1="30"  x2="150" y2="270" stroke="#ececec" stroke-width="1"/>

  <!-- Axes -->
  <line x1="30"  y1="150" x2="270" y2="150" stroke="#aaa" stroke-width="1.4"/>
  <line x1="150" y1="270" x2="150" y2="30"  stroke="#aaa" stroke-width="1.4"/>
  <polygon points="270,150 263,146 263,154" fill="#aaa"/>
  <polygon points="150,30 146,37 154,37"   fill="#aaa"/>
  <text x="273" y="154" font-size="12" fill="#888" font-style="italic">x</text>
  <text x="154" y="27"  font-size="12" fill="#888" font-style="italic">y</text>

  <!-- Axis tick labels -->
  <text x="148" y="167" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="248" y="167" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="50"  y="167" text-anchor="middle" font-size="10" fill="#aaa">-1</text>
  <text x="138" y="55"  text-anchor="end"    font-size="10" fill="#aaa">1</text>
  <text x="138" y="252" text-anchor="end"    font-size="10" fill="#aaa">-1</text>

  <!-- Unit circle -->
  <circle cx="150" cy="150" r="100" fill="none" stroke="#bbb" stroke-width="1.5"/>

  <!-- Arc: counterclockwise from U(1,0) to W(0,-1) = 270° sweep -->
  <!-- In SVG: y-axis is flipped. Counterclockwise math = clockwise SVG.  -->
  <!-- U is at angle 0 → SVG (250,150). W is at angle 270° math → SVG (150,250). -->
  <!-- Counterclockwise math from 0 to 270° = 270° sweep counterclockwise math -->
  <!-- In SVG sweep-flag=0 means counterclockwise (math CCW). -->
  <!-- Arc from (250,150) to (150,250), radius 100, large-arc=1 (270>180), sweep=0 -->
  <path d="M 250,150 A 100,100 0 1 0 150,250"
        fill="none" stroke="#4a6fa5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arrow at end of arc (at W = 150,250), tangent direction for CCW math = pointing left in SVG -->
  <polygon points="150,250 160,243 157,254" fill="#4a6fa5"/>

  <!-- Angle label — placed along the arc, roughly at 135° math = SVG 225° → (-√2/2, √2/2)*100 -->
  <!-- SVG coords: cx=150-71=79, cy=150-71=79 — that's top-left; 225° math = bottom-left SVG -->
  <!-- 225° math: SVG x=150+100*cos(225°)=150-70.7=79, SVG y=150-100*sin(225°)=150+70.7=221 -->
  <text x="62" y="228" font-size="11" fill="#4a6fa5" font-style="italic">3π/2</text>
  <text x="48" y="242" font-size="10" fill="#4a6fa5">(base angle)</text>

  <!-- Radii: V→U and V→W -->
  <line x1="150" y1="150" x2="250" y2="150" stroke="#e05a2b" stroke-width="1.8" stroke-dasharray="5,3"/>
  <line x1="150" y1="150" x2="150" y2="250" stroke="#e05a2b" stroke-width="1.8" stroke-dasharray="5,3"/>

  <!-- Point V = center (0,0) → SVG (150,150) -->
  <circle cx="150" cy="150" r="5" fill="#333"/>
  <text x="138" y="145" text-anchor="end" font-size="12" fill="#333" font-weight="bold" font-style="italic">V</text>
  <text x="138" y="157" text-anchor="end" font-size="10" fill="#777">(0,0)</text>

  <!-- Point U = (1,0) → SVG (250,150) -->
  <circle cx="250" cy="150" r="5" fill="#e05a2b"/>
  <text x="255" y="145" font-size="12" fill="#e05a2b" font-weight="bold" font-style="italic">U</text>
  <text x="255" y="157" font-size="10" fill="#e05a2b">(1,0)</text>

  <!-- Point W = (0,-1) → SVG (150,250) -->
  <circle cx="150" cy="250" r="5" fill="#3a9e6e"/>
  <text x="157" y="248" font-size="12" fill="#3a9e6e" font-weight="bold" font-style="italic">W</text>
  <text x="157" y="262" font-size="10" fill="#3a9e6e">(0,−1)</text>

  <!-- Small angle indicator at V -->
  <path d="M 170,150 A 20,20 0 1 0 150,170" fill="none" stroke="#4a6fa5" stroke-width="1.2"/>

</svg>
